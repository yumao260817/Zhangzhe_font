charset: level1

qa:
  ocr_pass: 0.95
  structure_pass: 0.85
  style_pass: 0.80

rework:
  max_attempts: 3
  fallback_order: [dl, assemble]

generate:
  grid_hw: 256
  anchors: 3

server:
  host: 0.0.0.0
  port: 8000
  # 敏感配置请使用环境变量注入，勿写入此文件：
  #   ZZ_ADMIN_TOKEN - 管理员旧口令（双轨凭证之一）
  #   ZZ_ADMIN_EMAILS - 逗号分隔的管理员邮箱列表（注册自动获得 admin 角色）
  # 本文件为模板，复制为 default.yaml 后按需修改

export:
  fmt: ttf
