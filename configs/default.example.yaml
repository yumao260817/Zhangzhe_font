charset: level1

qa:
  ocr_pass: 0.95
  structure_pass: 0.85
  style_pass: 0.80

rework:
  max_attempts: 3
  fallback_order: [dl, assemble]

generate:
  grid_hw: 256
  anchors: 3

server:
  host: 0.0.0.0
  port: 8000
  # 管理员鉴权仅依赖已登录的管理员邮箱账号（role=admin），无其他后门口令
  # 管理员邮箱配置示例（注册时自动获得 admin 角色）：
  #   admin_emails:
  #     - admin@example.com
  # 本文件为模板，复制为 default.yaml 后按需修改

export:
  fmt: ttf
